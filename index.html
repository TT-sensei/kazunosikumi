<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>number-park（すうじパーク）</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="shushutto.css">
</head>
<body>
  <header class="app-header">
    <p class="eyebrow">小学校2〜3年生向け</p>
    <div class="app-header-main">
    <div class="app-title-block">
      <h1>number-park <span>すうじパーク</span></h1>
      <p>数をつくる・分ける・くらべる。操作しながら、大きな数のしくみを見つけよう。</p>
    </div>
    <div id="navi-daily-root" aria-label="六人のナビキャラの日常"></div>
  </div>
  <div class="app-tools">
    <button id="furigana-toggle" class="furigana-toggle" type="button" aria-pressed="false">ふりがな：ON</button>
  </div>
  </header>

  <nav class="tabs" aria-label="学習メニュー">
    <div class="tab-group tab-group-practice" aria-label="問題に挑戦">
      <span class="tab-group-label">チャレンジ</span>
      <button type="button" class="tab is-active" data-tab="quiz" aria-controls="quiz" aria-pressed="true">10問に挑戦</button>
    </div>
    <div class="tab-group tab-group-number" aria-label="数のしくみを調べる">
      <span class="tab-group-label">数のしくみを調べる</span>
      <div class="tab-group-buttons">
        <button type="button" class="tab" data-tab="composer" aria-controls="composer" aria-pressed="false">数をつくる</button>
        <button type="button" class="tab tab-shushutto" data-tab="shushutto" aria-controls="shushutto" aria-pressed="false">✦ シュシュっと</button>
        <button type="button" class="tab" data-tab="decomposer" aria-controls="decomposer" aria-pressed="false">数を分ける</button>
        <button type="button" class="tab" data-tab="number-line" aria-controls="number-line" aria-pressed="false">数のならび</button>
        <button type="button" class="tab" data-tab="comparison" aria-controls="comparison" aria-pressed="false">大きさくらべ</button>
        <button type="button" class="tab" data-tab="grouping" aria-controls="grouping" aria-pressed="false">いくつ分</button>
      </div>
    </div>
    <div class="tab-group tab-group-collection" aria-label="学習の記録">
      <span class="tab-group-label">学習の記録</span>
      <button type="button" class="tab tab-collection" data-tab="badges" aria-controls="badges" aria-pressed="false">🏅 バッジ</button>
    </div>
  </nav>

  <main class="app-shell">
    <section id="quiz" class="panel is-active" aria-labelledby="quiz-title">
      <h2 id="quiz-title">チャレンジ（10問）</h2>
      <div id="quiz-root"></div>
    </section>
    <section id="composer" class="panel" aria-labelledby="composer-title">
      <h2 id="composer-title">数をつくる（構成）</h2>
      <div id="composer-root"></div>
    </section>
    <section id="shushutto" class="panel" aria-labelledby="shushutto-title">
      <h2 id="shushutto-title">シュシュっとかず作り</h2>
      <div id="shushutto-root"></div>
    </section>
    <section id="decomposer" class="panel" aria-labelledby="decomposer-title">
      <h2 id="decomposer-title">数を分ける（分解）</h2>
      <div id="decomposer-root"></div>
    </section>
    <section id="number-line" class="panel" aria-labelledby="number-line-title">
      <h2 id="number-line-title">数のならび（数直線）</h2>
      <div id="number-line-root"></div>
    </section>
    <section id="comparison" class="panel" aria-labelledby="comparison-title">
      <h2 id="comparison-title">大きさくらべ</h2>
      <div id="comparison-root"></div>
    </section>
    <section id="grouping" class="panel" aria-labelledby="grouping-title">
      <h2 id="grouping-title">いくつ分（単位）</h2>
      <div id="grouping-root"></div>
    </section>
    <section id="badges" class="panel" aria-labelledby="badges-title">
      <h2 id="badges-title">バッジコレクション</h2>
      <div id="badge-root"></div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
